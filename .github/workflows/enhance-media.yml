name: Enhance gift media

on:
  push:
    paths:
      - '.github/workflows/enhance-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check opencv-contrib-python-headless

      - name: Download EDSR super-resolution model
        run: |
          mkdir -p .media-tools
          curl -L --fail --retry 3 \
            -o .media-tools/EDSR_x4.pb \
            https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb

      - name: Enhance personal photos and treatment media
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          import re
          import urllib.request
          import cv2
          import numpy as np

          hq_personal = Path('assets/hq/personal')
          hq_treatments = Path('assets/hq/treatments')
          hq_personal.mkdir(parents=True, exist_ok=True)
          hq_treatments.mkdir(parents=True, exist_ok=True)

          model_path = Path('.media-tools/EDSR_x4.pb')
          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel(str(model_path))
          sr.setModel('edsr', 4)

          def polish(image):
              blurred = cv2.GaussianBlur(image, (0, 0), 0.85)
              image = cv2.addWeighted(image, 1.08, blurred, -0.08, 0)
              lab = cv2.cvtColor(image, cv2.COLOR_BGR2LAB)
              l, a, b = cv2.split(lab)
              l = cv2.createCLAHE(clipLimit=1.03, tileGridSize=(8, 8)).apply(l)
              return cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          def decode_b64_file(path):
              text = path.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              text = text.rstrip('=')
              text += '=' * ((4 - len(text) % 4) % 4)
              raw = base64.b64decode(text, validate=False)
              return cv2.imdecode(np.frombuffer(raw, dtype=np.uint8), cv2.IMREAD_COLOR)

          stems = [
              '01-opening','02-clue-1','03-clue-2','04-choice','05-scratch',
              '06-first-reveal','07-response','08-plot-twist','09-options','10-final'
          ]

          for stem in stems:
              image = None
              b64_path = Path('assets/bg64') / f'{stem}.b64'
              jpg_path = Path('assets/personal') / f'{stem}.jpg'

              if b64_path.exists():
                  try:
                      image = decode_b64_file(b64_path)
                  except Exception as exc:
                      print(f'Base64 source skipped for {stem}: {exc}')

              if image is None and jpg_path.exists():
                  image = cv2.imread(str(jpg_path), cv2.IMREAD_COLOR)
                  print(f'Using JPEG fallback for {stem}')

              if image is None:
                  print(f'Skipping {stem}: no decodable personal source')
                  continue

              try:
                  enhanced = sr.upsample(image)
              except Exception as exc:
                  print(f'EDSR fallback for {stem}: {exc}')
                  enhanced = cv2.resize(
                      image,
                      (image.shape[1] * 4, image.shape[0] * 4),
                      interpolation=cv2.INTER_LANCZOS4,
                  )

              enhanced = polish(enhanced)
              dst = hq_personal / f'{stem}.webp'
              if not cv2.imwrite(str(dst), enhanced, [cv2.IMWRITE_WEBP_QUALITY, 94]):
                  raise RuntimeError(f'Cannot write {dst}')
              print(f'{stem} -> {dst}: {enhanced.shape[1]}x{enhanced.shape[0]}')

          treatment_urls = {
              'botox-2-zone': 'https://checkout.clinicitalia.it/app/uploads/2026/04/02_Clinic-promo-botox2zone-1x1-2.jpg',
              'botox-completo': 'https://checkout.clinicitalia.it/app/uploads/2026/04/03_Clinic-promo-botoxfull-1x1-2.jpg',
              'botox-filler-longevity': 'https://checkout.clinicitalia.it/app/uploads/2026/04/14_Clinic-promo-botox2zone_3fillerscelta_1x1.jpg',
              'filler-contouring': 'https://checkout.clinicitalia.it/app/uploads/2026/04/07_Clinic-promo-longcont-1x1-2.jpg',
          }
          headers = {'User-Agent': 'Mozilla/5.0 gift-media-refresh/1.0'}

          for name, url in treatment_urls.items():
              image = None
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                  image = cv2.imdecode(np.frombuffer(raw, dtype=np.uint8), cv2.IMREAD_COLOR)
                  if image is not None:
                      print(f'Downloaded full-size Clinic media for {name}')
              except Exception as exc:
                  print(f'Clinic download fallback for {name}: {exc}')

              if image is None:
                  local = Path('assets/treatments') / f'{name}.jpg'
                  if local.exists():
                      image = cv2.imread(str(local), cv2.IMREAD_COLOR)

              if image is None:
                  print(f'Skipping treatment {name}: no decodable source')
                  continue

              image = polish(image)
              dst = hq_treatments / f'{name}.webp'
              if not cv2.imwrite(str(dst), image, [cv2.IMWRITE_WEBP_QUALITY, 95]):
                  raise RuntimeError(f'Cannot write {dst}')
              print(f'{name} -> {dst}: {image.shape[1]}x{image.shape[0]}')
          PY

      - name: Commit enhanced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/hq/
          if git diff --cached --quiet; then
            echo "No enhanced media changes."
          else
            git commit -m "Generate high-resolution gift media"
            git push origin HEAD:main
          fi
