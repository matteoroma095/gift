name: Enhance gift media

on:
  push:
    paths:
      - '.github/workflows/enhance-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow opencv-contrib-python-headless

      - name: Download EDSR super-resolution model
        run: |
          mkdir -p .media-tools
          curl -L --fail --retry 3 \
            -o .media-tools/EDSR_x4.pb \
            https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb

      - name: Generate high-resolution web assets
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import cv2
          import numpy as np

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          model_path = Path('.media-tools/EDSR_x4.pb')
          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel(str(model_path))
          sr.setModel('edsr', 4)

          groups = [
              (Path('assets/personal'), Path('assets/hq/personal')),
              (Path('assets/treatments'), Path('assets/hq/treatments')),
          ]

          for src_dir, dst_dir in groups:
              dst_dir.mkdir(parents=True, exist_ok=True)
              for src in sorted(src_dir.glob('*.jpg')):
                  # Pillow is deliberately used for decoding because the original
                  # mobile-optimised JPEGs contain harmless trailing bytes that
                  # OpenCV's JPEG decoder may reject.
                  pil = Image.open(src).convert('RGB')
                  rgb = np.asarray(pil)
                  image = cv2.cvtColor(rgb, cv2.COLOR_RGB2BGR)

                  try:
                      enhanced = sr.upsample(image)
                  except Exception as exc:
                      print(f'EDSR fallback for {src}: {exc}')
                      enhanced = cv2.resize(
                          image,
                          (image.shape[1] * 4, image.shape[0] * 4),
                          interpolation=cv2.INTER_LANCZOS4,
                      )

                  blurred = cv2.GaussianBlur(enhanced, (0, 0), 1.0)
                  enhanced = cv2.addWeighted(enhanced, 1.12, blurred, -0.12, 0)

                  # Mild local-contrast lift; intentionally conservative on faces.
                  lab = cv2.cvtColor(enhanced, cv2.COLOR_BGR2LAB)
                  l, a, b = cv2.split(lab)
                  clahe = cv2.createCLAHE(clipLimit=1.08, tileGridSize=(8, 8))
                  l = clahe.apply(l)
                  enhanced = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

                  dst = dst_dir / f'{src.stem}.webp'
                  ok = cv2.imwrite(str(dst), enhanced, [cv2.IMWRITE_WEBP_QUALITY, 93])
                  if not ok:
                      raise RuntimeError(f'Cannot write {dst}')
                  print(f'{src} -> {dst}  {enhanced.shape[1]}x{enhanced.shape[0]}')
          PY

      - name: Commit enhanced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/hq/
          if git diff --cached --quiet; then
            echo "No enhanced media changes."
          else
            git commit -m "Generate high-resolution gift media"
            git push origin HEAD:main
          fi
