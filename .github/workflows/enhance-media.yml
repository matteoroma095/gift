name: Enhance gift media

on:
  push:
    paths:
      - '.github/workflows/enhance-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check opencv-contrib-python-headless

      - name: Download EDSR super-resolution model
        run: |
          mkdir -p .media-tools
          curl -L --fail --retry 3 \
            -o .media-tools/EDSR_x4.pb \
            https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb

      - name: Decode, enhance and download pristine media
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          import urllib.request
          import cv2
          import numpy as np

          hq_personal = Path('assets/hq/personal')
          hq_treatments = Path('assets/hq/treatments')
          hq_personal.mkdir(parents=True, exist_ok=True)
          hq_treatments.mkdir(parents=True, exist_ok=True)

          model_path = Path('.media-tools/EDSR_x4.pb')
          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel(str(model_path))
          sr.setModel('edsr', 4)

          def polish(image):
              blurred = cv2.GaussianBlur(image, (0, 0), 1.0)
              image = cv2.addWeighted(image, 1.10, blurred, -0.10, 0)
              lab = cv2.cvtColor(image, cv2.COLOR_BGR2LAB)
              l, a, b = cv2.split(lab)
              l = cv2.createCLAHE(clipLimit=1.05, tileGridSize=(8, 8)).apply(l)
              return cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          # Personal photos: the .b64 files are the reliable browser-safe media
          # already present in this repository. Decode those, then use EDSR x4.
          for src in sorted(Path('assets/bg64').glob('*.b64')):
              raw = base64.b64decode(src.read_text(encoding='utf-8').strip())
              image = cv2.imdecode(np.frombuffer(raw, dtype=np.uint8), cv2.IMREAD_COLOR)
              if image is None:
                  raise RuntimeError(f'Cannot decode {src}')
              try:
                  enhanced = sr.upsample(image)
              except Exception as exc:
                  print(f'EDSR fallback for {src}: {exc}')
                  enhanced = cv2.resize(image, (image.shape[1]*4, image.shape[0]*4), interpolation=cv2.INTER_LANCZOS4)
              enhanced = polish(enhanced)
              dst = hq_personal / f'{src.stem}.webp'
              if not cv2.imwrite(str(dst), enhanced, [cv2.IMWRITE_WEBP_QUALITY, 94]):
                  raise RuntimeError(f'Cannot write {dst}')
              print(f'{src} -> {dst}: {enhanced.shape[1]}x{enhanced.shape[0]}')

          # Treatment media: download the current full-size Clinic creatives,
          # rather than upscaling the previously compressed repository copies.
          treatment_urls = {
              'botox-2-zone': 'https://checkout.clinicitalia.it/app/uploads/2026/04/02_Clinic-promo-botox2zone-1x1-2.jpg',
              'botox-completo': 'https://checkout.clinicitalia.it/app/uploads/2026/04/03_Clinic-promo-botoxfull-1x1-2.jpg',
              'botox-filler-longevity': 'https://checkout.clinicitalia.it/app/uploads/2026/04/14_Clinic-promo-botox2zone_3fillerscelta_1x1.jpg',
              'filler-contouring': 'https://checkout.clinicitalia.it/app/uploads/2026/04/07_Clinic-promo-longcont-1x1-2.jpg',
          }
          headers = {'User-Agent': 'Mozilla/5.0 gift-media-refresh/1.0'}
          for name, url in treatment_urls.items():
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
              image = cv2.imdecode(np.frombuffer(raw, dtype=np.uint8), cv2.IMREAD_COLOR)
              if image is None:
                  raise RuntimeError(f'Cannot decode downloaded treatment {name}')
              image = polish(image)
              dst = hq_treatments / f'{name}.webp'
              if not cv2.imwrite(str(dst), image, [cv2.IMWRITE_WEBP_QUALITY, 95]):
                  raise RuntimeError(f'Cannot write {dst}')
              print(f'{url} -> {dst}: {image.shape[1]}x{image.shape[0]}')
          PY

      - name: Commit enhanced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/hq/
          if git diff --cached --quiet; then
            echo "No enhanced media changes."
          else
            git commit -m "Generate high-resolution gift media"
            git push origin HEAD:main
          fi
