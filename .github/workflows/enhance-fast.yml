name: Build fast HQ gift media

on:
  push:
    paths:
      - '.github/workflows/enhance-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build HQ WebP assets
        run: |
          python <<'PY'
          from pathlib import Path
          from io import BytesIO
          import urllib.request
          from PIL import Image, ImageEnhance, ImageFilter

          personal_out = Path('assets/hq/personal')
          treatment_out = Path('assets/hq/treatments')
          personal_out.mkdir(parents=True, exist_ok=True)
          treatment_out.mkdir(parents=True, exist_ok=True)

          stems = [
              '01-opening','02-clue-1','03-clue-2','04-choice','05-scratch',
              '06-first-reveal','07-response','08-plot-twist','09-options','10-final'
          ]

          def polish(im, max_side=1920):
              im = im.convert('RGB')
              w, h = im.size
              scale = min(max_side / max(w, h), 4.0)
              if scale > 1.02:
                  im = im.resize((round(w*scale), round(h*scale)), Image.Resampling.LANCZOS)
              im = ImageEnhance.Contrast(im).enhance(1.035)
              im = ImageEnhance.Sharpness(im).enhance(1.18)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.7, percent=55, threshold=3))
              return im

          for stem in stems:
              src = Path('assets/personal') / f'{stem}.jpg'
              if not src.exists():
                  print('Missing', src)
                  continue
              im = polish(Image.open(src))
              dst = personal_out / f'{stem}.webp'
              im.save(dst, 'WEBP', quality=92, method=6)
              print(src, '->', dst, im.size, dst.stat().st_size)

          treatment_urls = {
              'botox-2-zone': 'https://checkout.clinicitalia.it/app/uploads/2026/04/02_Clinic-promo-botox2zone-1x1-2.jpg',
              'botox-completo': 'https://checkout.clinicitalia.it/app/uploads/2026/04/03_Clinic-promo-botoxfull-1x1-2.jpg',
              'botox-filler-longevity': 'https://checkout.clinicitalia.it/app/uploads/2026/04/14_Clinic-promo-botox2zone_3fillerscelta_1x1.jpg',
              'filler-contouring': 'https://checkout.clinicitalia.it/app/uploads/2026/04/07_Clinic-promo-longcont-1x1-2.jpg',
          }
          headers = {'User-Agent':'Mozilla/5.0 gift-media-refresh/2.0'}
          for name, url in treatment_urls.items():
              im = None
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      im = Image.open(BytesIO(response.read())).convert('RGB')
                  print('Downloaded Clinic source:', name, im.size)
              except Exception as exc:
                  print('Clinic download fallback:', name, exc)
                  local = Path('assets/treatments') / f'{name}.jpg'
                  if local.exists():
                      im = Image.open(local).convert('RGB')
              if im is None:
                  continue
              im = ImageEnhance.Contrast(im).enhance(1.02)
              im = ImageEnhance.Sharpness(im).enhance(1.08)
              dst = treatment_out / f'{name}.webp'
              im.save(dst, 'WEBP', quality=95, method=6)
              print(name, '->', dst, im.size, dst.stat().st_size)
          PY

      - name: Commit HQ assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/hq/
          if git diff --cached --quiet; then
            echo "No HQ media changes."
          else
            git commit -m "Build optimized high-quality gift media"
            git push origin HEAD:main
          fi
