name: Bootstrap gift media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media helpers
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Materialize photos and treatment media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bootstrap_assets.py

      - name: Commit media files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/
          if git diff --cached --quiet; then
            echo "No media changes to commit."
          else
            git commit -m "Add gift media assets"
            git push origin HEAD:main
          fi
